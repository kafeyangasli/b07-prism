<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="picker(prefix, selectionPath, emptyMessage)" data-facility-picker>
    <label class="ui-label" th:for="${prefix + '-search'}">Cari fasilitas</label>
    <div data-list-tools>
        <input class="ui-input" th:id="${prefix + '-search'}" type="search" data-facility-search
               th:attr="data-list-search=${prefix + '-search-results'},aria-controls=${prefix + '-search-results'},aria-describedby=${prefix + '-search-help ' + prefix + '-error'}"
               th:value="${selectedFacility != null ? selectedFacility.name : ''}" required autocomplete="off"
               placeholder="Cari nama, kode, atau lokasi fasilitas…"
               th:aria-invalid="${#fields.hasErrors('facilityId')}">
        <p th:id="${prefix + '-search-help'}" class="ui-hint">Pilih fasilitas dari hasil pencarian.</p>
        <p class="ui-hint" data-list-count aria-live="polite"></p>
    </div>
    <div th:id="${prefix + '-search-results'}" data-facility-results class="mt-3 max-h-72 overflow-y-auto space-y-2"
         th:attr="hidden=${selectedFacility != null ? 'hidden' : null}">
        <a th:each="facility : ${facilities}" th:href="@{${selectionPath}(facilityId=${facility.id})}"
           class="ui-btn ui-btn-secondary w-full text-left justify-start" data-list-record data-select-facility
           th:attr="data-facility-id=${facility.id},data-facility-name=${facility.name},data-search-text=${facility.name + ' ' + facility.code + ' ' + facility.location + ' ' + facility.facilityType.name}">
            <span><strong class="block" th:text="${facility.name}"></strong><span class="text-xs" th:text="${facility.code + ' · ' + facility.location}"></span></span>
            <template data-facility-context-template><div th:replace="~{fragments/facility-picker :: context(${facility})}"></div></template>
        </a>
        <p th:if="${#lists.isEmpty(facilities)}" class="ui-empty-state" th:text="${emptyMessage}"></p>
    </div>
    <div class="mt-3" data-selected-facility-context>
        <th:block th:if="${selectedFacility != null}"><div th:replace="~{fragments/facility-picker :: context(${selectedFacility})}"></div></th:block>
    </div>
    <button type="button" class="ui-btn ui-btn-ghost mt-2" data-clear-facility
            th:attr="hidden=${selectedFacility == null ? 'hidden' : null}">Ganti fasilitas</button>
    <p th:id="${prefix + '-error'}" class="ui-field-error" th:errors="*{facilityId}"></p>
</div>

<div th:fragment="context(facility)" class="ui-facility-context"
     th:attr="data-selected-facility-id=${facility.id},data-selected-facility-name=${facility.name}">
    <div><span class="ui-eyebrow">Fasilitas dipilih</span><strong th:text="${facility.name}">Nama fasilitas</strong>
        <p th:text="${facility.location + (facility.equipment ? ' · Alat' : ' · Kapasitas ' + facility.capacity + ' orang')}">Lokasi</p>
    </div>
</div>
</body>
</html>
