<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Manajemen Laporan', 'staff-reports', ~{::main})}">
<body>
<main>
    <div class="ui-page">
        <header th:replace="~{fragments/page :: heading('Operasional', 'Manajemen Laporan', 'Pantau laporan fasilitas yang masih memerlukan penanganan.')}">
        </header>
        <div th:replace="~{fragments/feedback :: flash}">
        </div>
        <section class="ui-section">
            <h2>
                Laporan terbuka
            </h2>
            <p class="ui-empty-state" th:if="${#lists.isEmpty(dashboard.unresolvedReports)}">
                Tidak ada laporan terbuka.
            </p>
            <div th:replace="~{fragments/workspace :: search('report-queue-search', 'report-queue-records', 'Cari dalam daftar…')}"></div>
<div class="ui-table-wrap" th:unless="${#lists.isEmpty(dashboard.unresolvedReports)}" id="report-queue-records">
                <table class="ui-table">
                    <thead>
                    <tr>
                        <th scope="col">Fasilitas</th>
                        <th scope="col">Kategori</th>
                        <th scope="col">Status</th>
                        <th scope="col">Masuk</th>
                        <th scope="col">Tindakan</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr data-list-record th:each="row : ${dashboard.unresolvedReports}">
                        <td data-label="Fasilitas" th:text="${row.facilityName}">
                        </td>
                        <td data-label="Kategori" th:text="${row.category}">
                        </td>
                        <td data-label="Status">
                            <span th:replace="~{fragments/status :: badge(${row.status})}">
                            </span>
                        </td>
                        <td data-label="Masuk"
                            th:text="${row.createdAt != null ? #temporals.format(row.createdAt, 'dd MMM yyyy, HH:mm') : '—'}">
                        </td>
                        <td data-label="Tindakan" class="ui-table-actions">
                            <a class="ui-btn ui-btn-secondary" th:href="@{/staff/reports/{id}(id=${row.id})}">Detail dan foto</a>
                            <div th:replace="~{reports/actions :: actions(${row.id}, ${row.status})}"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <section class="ui-section" aria-labelledby="report-history-title">
            <h2 id="report-history-title">Riwayat laporan</h2>
            <p class="ui-hint">Laporan yang telah selesai atau ditolak tetap dapat dilihat di sini.</p>
            <div th:replace="~{fragments/workspace :: historyTools('staff-report-history-search', 'staff-report-history-records', true, true)}"></div>
            <p class="ui-empty-state" th:if="${#lists.isEmpty(reportHistory)}">Belum ada laporan yang selesai atau ditolak.</p>
            <div id="staff-report-history-records" class="ui-table-wrap" th:unless="${#lists.isEmpty(reportHistory)}">
                <table class="ui-table">
                    <thead><tr><th scope="col">Fasilitas</th><th scope="col">Kategori</th><th scope="col">Status</th><th scope="col">Masuk</th><th scope="col">Detail</th></tr></thead>
                    <tbody><tr data-list-record th:each="row : ${reportHistory}" th:attr="data-record-status=${row.status},data-record-date=${row.createdAt != null ? #temporals.format(row.createdAt, 'yyyy-MM-dd') : ''}">
                        <td data-label="Fasilitas" th:text="${row.facilityName}"></td>
                        <td data-label="Kategori" th:text="${row.category}"></td>
                        <td data-label="Status"><span th:replace="~{fragments/status :: badge(${row.status})}"></span></td>
                        <td data-label="Masuk" th:text="${row.createdAt != null ? #temporals.format(row.createdAt, 'dd MMM yyyy, HH:mm') : '—'}"></td>
                        <td data-label="Detail" class="ui-table-actions"><a class="ui-btn ui-btn-secondary" th:href="@{/staff/reports/{id}(id=${row.id})}">Lihat laporan</a></td>
                    </tr></tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</body>
</html>
