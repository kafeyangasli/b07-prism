<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Tipe Fasilitas', 'admin-facility-types', ~{::main})}">
<body>
<main>
    <div class="ui-page">
        <header class="ui-page-header">
            <div>
                <p class="ui-eyebrow">Administrasi</p>
                <h1>Tipe Fasilitas</h1>
                <p class="ui-description">Kelola kategori yang dapat dipilih untuk fasilitas.</p>
            </div>
        </header>

        <div th:replace="~{fragments/feedback :: flash}"></div>

        <section class="ui-card ui-card-body">
            <h2>Tambah tipe</h2>
            <form class="ui-form ui-form-grid mt-4" th:action="@{/admin/facility-types}"
                  th:object="${facilityTypeDto}" method="post">
                <div class="md:col-span-full" th:replace="~{fragments/feedback :: formErrors}"></div>
                <div>
                    <label class="ui-label" for="type-code">Kode</label>
                    <input id="type-code" class="ui-input" th:field="*{code}" maxlength="80" required>
                    <p class="ui-field-error" th:errors="*{code}"></p>
                </div>
                <div>
                    <label class="ui-label" for="type-name">Nama</label>
                    <input id="type-name" class="ui-input" th:field="*{name}" maxlength="150" required>
                    <p class="ui-field-error" th:errors="*{name}"></p>
                </div>
                <div class="md:col-span-full">
                    <label class="ui-label" for="type-description">Deskripsi</label>
                    <textarea id="type-description" class="ui-input" th:field="*{description}" maxlength="2000"></textarea>
                </div>
                <div class="ui-form-actions md:col-span-full">
                    <button class="ui-btn ui-btn-primary" type="submit">Tambah Tipe</button>
                </div>
            </form>
        </section>

        <section class="ui-section">
            <div class="ui-section-heading">
                <div>
                    <h2>Daftar tipe</h2>
                    <p class="ui-hint" th:text="${#lists.size(facilityTypes) + ' tipe tercatat'}">0 tipe tercatat</p>
                </div>
            </div>
            <div class="ui-table-wrap">
                <table class="ui-table">
                    <thead><tr><th>Kode</th><th>Nama dan deskripsi</th><th>Status</th><th>Aksi</th></tr></thead>
                    <tbody>
                    <tr th:each="type : ${facilityTypes}">
                        <td data-label="Kode" th:text="${type.code}"></td>
                        <td data-label="Nama dan deskripsi">
                            <form class="ui-form" th:action="@{/admin/facility-types/{id}/update(id=${type.id})}" method="post">
                                <input type="hidden" name="code" th:value="${type.code}">
                                <input class="ui-input" name="name" th:value="${type.name}" maxlength="150" required>
                                <textarea class="ui-input" name="description" th:text="${type.description}" maxlength="2000"></textarea>
                                <button class="ui-btn ui-btn-secondary" type="submit">Simpan perubahan</button>
                            </form>
                        </td>
                        <td data-label="Status" th:text="${type.active ? 'Aktif' : 'Tidak aktif'}"></td>
                        <td data-label="Aksi" class="ui-table-actions">
                            <form th:if="${type.active}" th:action="@{/admin/facility-types/{id}/deactivate(id=${type.id})}" method="post">
                                <button class="ui-btn ui-btn-danger" type="submit">Nonaktifkan</button>
                            </form>
                            <form th:unless="${type.active}" th:action="@{/admin/facility-types/{id}/activate(id=${type.id})}" method="post">
                                <button class="ui-btn ui-btn-primary" type="submit">Aktifkan</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</body>
</html>
