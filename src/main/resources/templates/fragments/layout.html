<!doctype html>
<html lang="id"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="layout(pageTitle, activeNav, content)">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <meta name="theme-color" content="#5d5098">
        <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
        <title th:text="${pageTitle + ' · PRISM'}">
            PRISM
        </title>
        <link rel="stylesheet" th:href="@{/css/app.css}">
        <script defer th:src="@{/vendor/htmx.min.js}">
        </script>
        <script defer th:src="@{/js/app.js}">
        </script>
    </head>
    <body>
        <a href="#main-content"
            class="sr-only fixed left-4 top-4 z-50 rounded-lg bg-white px-4 py-2 font-semibold text-ink-900 shadow-lg focus:not-sr-only">
            Lewati ke konten utama
        </a>
        <div id="global-progress"
            class="htmx-indicator fixed inset-x-0 top-0 z-50 h-1 bg-prism-600"
            role="progressbar"
            aria-label="Memuat">
        </div>
        <header th:replace="~{fragments/navigation :: navbar(${activeNav})}">
        </header>
        <div class="ui-container pt-4 has-[[hidden]]:hidden">
            <div id="htmx-error" class="ui-alert ui-alert-error" role="alert" tabindex="-1" hidden>
                <p data-error-message>
                    Permintaan tidak dapat diproses. Silakan coba lagi.
                </p>
                <button type="button" class="font-semibold" data-dismiss-alert aria-label="Tutup pesan">
                    Tutup
                </button>
            </div>
        </div>
        <div id="main-content" tabindex="-1" class="ui-container py-8 sm:py-10">
            <main th:replace="${content}">
            </main>
        </div>
        <footer class="mt-auto border-t border-ink-200 bg-white py-6">
            <div class="ui-container flex flex-col gap-1 text-sm text-ink-500 sm:flex-row sm:items-center sm:justify-between">
                <p class="copyright">
                    &copy; 2026 <span>PRISM,</span> All rights reserved.
                </p>
            </div>
        </footer>
    </body>
</html>
