<!doctype html>
<html lang="id"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:replace="~{fragments/layout :: layout('Beranda', 'minimal', ~{::main})}">
    <body>
        <main>
            <section class="ui-hero" aria-labelledby="hero-title">
                <div class="max-w-3xl">
                    <p class="ui-eyebrow">Fasilitas kampus dalam satu layanan</p>
                    <h1 id="hero-title" class="text-4xl font-bold tracking-tight sm:text-5xl">
                        PRISM
                    </h1>
                    <p class="mt-3 text-xl font-semibold text-prism-800">
                        Platform for Reservation and Issue Management
                    </p>
                    <p class="mt-5 max-w-2xl text-base leading-7 text-ink-600 sm:text-lg">
                        Temukan dan reservasi fasilitas kampus, pantau jadwal penggunaan, serta kelola kendala fasilitas secara terpusat.
                    </p>
                    <div class="mt-8 flex flex-col gap-3 sm:flex-row">
                        <a sec:authorize="!isAuthenticated()" th:href="@{/reservations/new}" th class="ui-btn ui-btn-primary">
                            Mulai Reservasi
                        </a>
                        <a th:href="@{/facilities}" class="ui-btn ui-btn-secondary">
                            Lihat Fasilitas
                        </a>
                    </div>
                    <p sec:authorize="!isAuthenticated()" class="mt-4 text-sm text-muted">
                        Anda akan diminta masuk sebelum mengajukan reservasi.
                    </p>
                </div>
            </section>
        </main>
    </body>
</html>
