<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Manajemen Reservasi', 'staff-reservations', ~{::main})}">
<body>
<main>
    <div class="ui-page">
        <header th:replace="~{fragments/page :: heading('Operasional', 'Manajemen Reservasi', 'Tinjau dan proses pengajuan reservasi yang masih menunggu.')}">
        </header>
        <div th:replace="~{fragments/feedback :: flash}">
        </div>
        <section class="ui-section">
            <div class="ui-section-heading">
                <h2>
                    Reservasi menunggu
                </h2>
                <nav class="flex flex-wrap items-center gap-2" aria-label="Urutan antrean">
                    <span class="mr-2 text-sm text-muted">
                        Urutkan:
                    </span>
                    <a class="ui-btn ui-btn-neutral"
                       th:classappend="${dashboard.reservationSort == 'created'} ? 'ui-nav-link-active'"
                       th:href="@{/staff/reservations(sort='created')}">
                        Waktu masuk
                    </a>
                    <a class="ui-btn ui-btn-neutral"
                       th:classappend="${dashboard.reservationSort == 'start'} ? 'ui-nav-link-active'"
                       th:href="@{/staff/reservations(sort='start')}">
                        Waktu penggunaan
                    </a>
                </nav>
            </div>
            <p class="ui-hint">
                Perhatikan jadwal penggunaan, batas pending, dan validitas proposal sebelum memproses.
            </p>
            <p class="ui-empty-state" th:if="${#lists.isEmpty(dashboard.pendingReservations)}">
                Semua pengajuan telah ditangani. Tidak ada reservasi yang dapat diproses.
            </p>
            <div class="ui-table-wrap" th:unless="${#lists.isEmpty(dashboard.pendingReservations)}">
                <table class="ui-table">
                    <thead>
                    <tr>
                        <th scope="col">Pemohon</th>
                        <th scope="col">Fasilitas</th>
                        <th scope="col">Penggunaan</th>
                        <th scope="col">Masuk</th>
                        <th scope="col">Proposal</th>
                        <th scope="col">Tindakan</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${dashboard.pendingReservations}">
                        <td data-label="Pemohon" th:text="${row.requesterName}">
                        </td>
                        <td data-label="Fasilitas" th:text="${row.facilityName}">
                        </td>
                        <td data-label="Penggunaan"
                            th:text="${#temporals.format(row.startAt, 'dd MMM yyyy, HH:mm') + ' – ' + #temporals.format(row.endAt, 'dd MMM yyyy, HH:mm')}">
                        </td>
                        <td data-label="Masuk">
                            <p th:text="${row.createdAt != null ? #temporals.format(row.createdAt, 'dd MMM yyyy, HH:mm') : '—'}">
                            </p>
                            <p class="mt-2 text-xs font-semibold text-warning">
                                Batas pending
                            </p>
                            <p class="text-xs text-muted"
                               th:text="${row.expiresAt != null ? #temporals.format(row.expiresAt, 'dd MMM yyyy, HH:mm') : '—'}">
                            </p>
                        </td>
                        <td data-label="Proposal"
                            th:text="${!row.proposalRequired ? 'Tidak wajib' : (row.proposalValidated ? 'Valid' : 'Belum valid')}">
                        </td>
                        <td th:replace="~{staff/reservation-actions :: actions(${row})}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
</body>
</html>
