<!doctype html>
<html lang="id"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <body>
        <header th:fragment="navbar(activeNav)" class="border-t-4 border-t-prism-600 border-b border-border bg-surface">
            <div class="ui-container grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-4 gap-y-3 py-4">
                <div class="contents">
                    <a th:href="@{/}" class="flex shrink-0 items-center gap-3 rounded-lg" aria-label="Beranda PRISM">
                        <img th:src="@{/images/prism-light.svg}" alt="PRISM" width="442" height="112" class="h-7 w-auto sm:h-10"/>
                    </a>
                    <details th:if="${activeNav != 'minimal'}" open data-navigation class="group col-span-2 row-start-2 border-t border-border pt-3">
                        <summary class="ui-btn ui-btn-neutral w-full justify-between lg:hidden">
                            Navigasi
                            <span aria-hidden="true">
                                ☰
                            </span>
                        </summary>
                        <nav aria-label="Navigasi utama" class="mt-3 grid gap-1 sm:grid-cols-2 lg:mt-0 lg:flex lg:flex-wrap lg:items-center">
                            <a th:href="@{/facilities}"
                                class="ui-nav-link"
                                th:classappend="${activeNav == 'facilities'} ? ' ui-nav-link-active'"
                                th:aria-current="${activeNav == 'facilities'} ? 'page' : null">
                                Fasilitas
                            </a>
                            <a sec:authorize="hasRole('PENGGUNA')"
                                th:href="@{/reservations}"
                                class="ui-nav-link"
                                th:classappend="${activeNav == 'reservations'} ? ' ui-nav-link-active'"
                                th:aria-current="${activeNav == 'reservations'} ? 'page' : null">
                                Reservasi Saya
                            </a>
                            <span sec:authorize="hasRole('PENGGUNA')"
                                class="ui-nav-link-disabled"
                                aria-disabled="true"
                                title="Halaman laporan sedang disiapkan">
                                Laporan Saya
                            </span>
                            <a sec:authorize="hasAnyRole('PETUGAS','ADMIN')"
                                th:href="@{/staff/dashboard}"
                                class="ui-nav-link"
                                th:classappend="${activeNav == 'dashboard'} ? ' ui-nav-link-active'"
                                th:aria-current="${activeNav == 'dashboard'} ? 'page' : null">
                                Dasbor
                            </a>
                            <a sec:authorize="hasAnyRole('PETUGAS','ADMIN')"
                                th:href="@{/staff/dashboard#pending-reservations}"
                                class="ui-nav-link">
                                Reservasi
                            </a>
                            <a sec:authorize="hasAnyRole('PETUGAS','ADMIN')"
                                th:href="@{/staff/dashboard#open-reports}"
                                class="ui-nav-link">
                                Laporan
                            </a>
                            <span sec:authorize="hasAnyRole('PETUGAS','ADMIN')"
                                class="ui-nav-link-disabled"
                                aria-disabled="true"
                                title="Halaman blokir sedang disiapkan">
                                Blokir
                            </span>
                            <a sec:authorize="hasRole('ADMIN')"
                                th:href="@{/admin/users}"
                                class="ui-nav-link"
                                th:classappend="${activeNav == 'users'} ? ' ui-nav-link-active'" th:aria-current="${activeNav == 'users'} ? 'page' : null">
                                Pengguna
                            </a>
                            <a sec:authorize="hasRole('ADMIN')"
                                th:href="@{/admin/facilities}"
                                class="ui-nav-link"
                                th:classappend="${activeNav == 'admin-facilities'} ? ' ui-nav-link-active'" th:aria-current="${activeNav == 'admin-facilities'} ? 'page' : null">
                                Kelola Fasilitas
                            </a>
                            <span sec:authorize="hasRole('ADMIN')"
                                class="ui-nav-link-disabled"
                                aria-disabled="true"
                                title="Halaman jenis blokir sedang disiapkan">
                                Jenis Blokir
                            </span>
                            <a sec:authorize="hasRole('ADMIN')"
                                th:href="@{/admin/recap}"
                                class="ui-nav-link"
                                th:classappend="${activeNav == 'recap'} ? ' ui-nav-link-active'" th:aria-current="${activeNav == 'recap'} ? 'page' : null">
                                Rekap / Ekspor
                            </a>
                        </nav>
                    </details>
                </div>
                <div class="col-start-2 row-start-1 flex min-w-0 items-center justify-end gap-2">
                    <div sec:authorize="isAuthenticated()" class="mr-2 hidden min-w-0 text-right md:block">
                        <p class="max-w-48 truncate text-sm font-medium text-ink-700" sec:authentication="name">
                            nama@kampus.ac.id
                        </p>
                        <p class="text-xs text-ink-500">
                            Akun aktif
                        </p>
                    </div>
                    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
                        <button type="submit" class="ui-btn ui-btn-secondary">
                            Keluar
                        </button>
                    </form>
                    <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="ui-btn ui-btn-secondary">
                        Masuk
                    </a>
                    <a sec:authorize="!isAuthenticated()" th:href="@{/auth/register}" class="ui-btn ui-btn-primary">
                        Daftar
                    </a>
                </div>
            </div>
        </header>
    </body>
</html>
