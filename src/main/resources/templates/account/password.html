<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Ubah Kata Sandi', 'account', ~{::main})}">
<body><main><div class="ui-page space-y-6 max-w-2xl">
    <div><h1 class="text-3xl font-bold tracking-tight">Ubah Kata Sandi</h1>
        <p class="ui-description">Setelah kata sandi diubah, sesi ini akan berakhir. Masuk kembali menggunakan kata sandi baru.</p></div>
    <div th:replace="~{fragments/feedback :: flash}"></div>
    <section class="ui-card"><div class="ui-card-body">
        <form th:action="@{/account/password}" method="post" class="ui-form">
            <div><label for="current-password" class="ui-label">Kata sandi saat ini</label>
                <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" class="ui-input" required></div>
            <div><label for="new-password" class="ui-label">Kata sandi baru</label>
                <input id="new-password" name="newPassword" type="password" autocomplete="new-password" class="ui-input" minlength="8" maxlength="72" required aria-describedby="password-hint">
                <p id="password-hint" class="ui-hint">Minimal 8 karakter dan maksimal 72 byte UTF-8. Harus berbeda dari kata sandi saat ini.</p></div>
            <div><label for="confirm-password" class="ui-label">Konfirmasi kata sandi baru</label>
                <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" class="ui-input" required></div>
            <div class="flex flex-wrap gap-3"><button class="ui-btn ui-btn-primary" type="submit">Simpan Kata Sandi</button>
                <a th:href="@{/account}" class="ui-btn ui-btn-secondary">Batal</a></div>
        </form>
    </div></section>
</div></main></body></html>
