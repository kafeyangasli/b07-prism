<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, activeNav, content)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#5d5098">
    <meta name="htmx-config" content='{"timeout":20000,"historyRestoreAsHxRequest":false}'>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle + ' - PRISM'}">PRISM</title>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/vendor/htmx.min.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
    <link rel="stylesheet" th:href="@{/css/facility-images.css}">
    <script defer th:src="@{/js/facility-images.js}"></script>
    <link rel="stylesheet" th:href="@{/css/avatar.css}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/prism-logo.png}">
    <script defer th:src="@{/js/avatar.js}"></script>
</head>
<body>
<a href="#main-content"
   class="sr-only fixed left-4 top-4 z-50 rounded-lg bg-surface px-4 py-2 font-semibold text-ink-900 shadow-lg focus:not-sr-only">Lewati
    ke konten utama</a>
<div id="global-progress" class="htmx-indicator fixed inset-x-0 top-0 z-50 h-1 bg-prism-600" role="progressbar"
     aria-label="Memuat"></div>

<th:block sec:authorize="!isAuthenticated()">
    <header th:replace="~{fragments/navigation :: publicNavbar(${activeNav})}"></header>
    <div class="ui-container pt-4 has-[[hidden]]:hidden">
        <div id="htmx-error" class="ui-alert ui-alert-error" role="alert" tabindex="-1" hidden>
            <p data-error-message>Permintaan tidak dapat diproses. Silakan coba lagi.</p>
            <button type="button" class="font-semibold" data-dismiss-alert aria-label="Tutup pesan">Tutup</button>
        </div>
    </div>
    <div id="main-content" tabindex="-1" class="ui-container py-8 sm:py-10" th:attr="data-active-nav=${activeNav}">
        <main th:replace="${content}"></main>
    </div>
    <footer class="mt-auto border-t border-ink-200 bg-surface py-6">
        <div class="ui-container text-sm text-ink-500"><p>&copy; 2026 PRISM. All rights reserved.</p></div>
    </footer>
</th:block>

<div sec:authorize="isAuthenticated()" class="ui-dashboard-shell" data-dashboard-shell>
    <header class="ui-mobile-header">
        <button type="button" class="ui-btn ui-btn-ghost" data-open-drawer aria-controls="dashboard-sidebar"
                aria-expanded="false" aria-label="Buka navigasi"><svg th:replace="~{fragments/workspace :: icon('menu')}"></svg>
        </button>
        <a th:href="@{/}" aria-label="Beranda PRISM"><span th:replace="~{fragments/workspace :: themeLogo('h-7 w-auto')}"></span></a>
        <div class="flex items-center gap-2">
            <button th:replace="~{fragments/workspace :: themeToggle}"></button>
            <a th:href="@{/account}" aria-label="Pengaturan Akun"><img th:replace="~{fragments/avatar :: avatar('ui-avatar-small')}"></a>
        </div>
    </header>
    <button type="button" class="ui-dashboard-backdrop" data-close-drawer aria-label="Tutup navigasi"
            tabindex="-1"></button>
    <aside th:replace="~{fragments/navigation :: sidebar(${activeNav})}"></aside>
    <div class="ui-dashboard-main">
        <header class="ui-workspace-bar" aria-label="PRISM">
            <div class="flex items-center gap-3"><span class="size-2 rounded-full bg-accent" aria-hidden="true"></span><span class="font-semibold text-content">PRISM</span><span class="text-border" aria-hidden="true">/</span><span sec:authorize="hasRole('PENGGUNA')" class="text-muted">Pengguna</span><span sec:authorize="hasRole('PETUGAS')" class="text-muted">Petugas</span><span sec:authorize="hasRole('ADMIN')" class="text-muted">Admin</span></div>
            <button th:replace="~{fragments/workspace :: themeToggle}"></button>
        </header>
        <div class="ui-dashboard-feedback has-[[hidden]]:hidden">
            <div id="htmx-error" class="ui-alert ui-alert-error" role="alert" tabindex="-1" hidden>
                <p data-error-message>Permintaan tidak dapat diproses. Silakan coba lagi.</p>
                <button type="button" class="font-semibold" data-dismiss-alert aria-label="Tutup pesan">Tutup</button>
            </div>
        </div>
        <div id="main-content" tabindex="-1" class="ui-dashboard-content">
            <div id="dashboard-content" tabindex="-1" th:attr="data-active-nav=${activeNav},data-navigation-name=${#authentication.principal.displayName}">
                <main th:replace="${content}"></main>
            </div>
        </div>
        <footer class="border-t border-border bg-surface px-5 py-5 text-sm text-muted sm:px-8"><p>&copy; 2026 PRISM. All
            rights reserved.</p></footer>
    </div>
</div>
</body>
</html>
