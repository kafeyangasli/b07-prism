<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout('Daftar', 'minimal', ~{::main})}">
<body>
<main>
    <div class="ui-page">
        <div class="ui-auth">
            <aside th:replace="~{fragments/workspace :: authAside}"></aside>
            <section class="ui-auth-content">
                <div>
                    <p class="ui-eyebrow">
                        Akun PRISM
                    </p>
                    <h1 class="text-2xl sm:text-3xl">
                        Buat akun PRISM
                    </h1>
                    <p class="ui-description text-sm">
                        Daftarkan akun untuk mulai mengajukan reservasi fasilitas kampus.
                    </p>
                </div>
                <div th:replace="~{fragments/feedback :: flash}">
                </div>
                <p class="ui-alert ui-alert-info">
                    Akun baru akan diverifikasi oleh admin sebelum dapat digunakan.
                </p>
                <form class="ui-form" th:action="@{/auth/register}" th:object="${registrationDto}" method="post">
                    <div class="md:col-span-full" th:replace="~{fragments/feedback :: formErrors}">
                    </div>
                    <div>
                        <label class="ui-label">
                            Nama lengkap
                            <input class="ui-input" type="text" th:field="*{name}" th:errorclass="ui-input-error"
                                   th:aria-invalid="${#fields.hasErrors('name')}" autocomplete="name" aria-describedby="register-name-error" required/>
                        </label>
                        <p id="register-name-error" class="ui-field-error" th:errors="*{name}"></p>
                    </div>
                    <div>
                        <label class="ui-label">
                            Email
                            <input class="ui-input" type="email" autocomplete="username" th:field="*{email}"
                                   th:errorclass="ui-input-error" th:aria-invalid="${#fields.hasErrors('email')}"
                                   aria-describedby="register-email-error" required/>
                        </label>
                        <p id="register-email-error" class="ui-field-error" th:errors="*{email}"></p>
                    </div>
                    <div>
                        <label class="ui-label">
                            Kata sandi
                            <input class="ui-input" type="password" data-password-toggle autocomplete="new-password" th:field="*{password}"
                                   th:errorclass="ui-input-error" th:aria-invalid="${#fields.hasErrors('password')}"
                                   aria-describedby="register-password-error" required/>
                        </label>
                        <p id="register-password-error" class="ui-field-error" th:errors="*{password}"></p>
                    </div>
                    <div>
                        <button class="ui-btn ui-btn-primary w-full" type="submit">
                            Daftar
                        </button>
                    </div>
                </form>
                <p class="text-sm text-muted">
                    Sudah punya akun?
                    <a class="ui-link" th:href="@{/login}">
                        Masuk
                    </a>
                </p>
            </section>
        </div>
    </div>
</main>
</body>
</html>
