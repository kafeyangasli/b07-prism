spring:
  application:
    name: b07-prism

  cache:
    type: none # please comment in production :D

  thymeleaf:
    cache: false # and this too

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    
  servlet:
    multipart:
      max-file-size: ${PRISM_MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${PRISM_MULTIPART_MAX_REQUEST_SIZE:110MB}

prism:
  storage:
    proposals: ${PRISM_PROPOSAL_STORAGE:./storage/proposals}
    facilities: ${PRISM_FACILITY_STORAGE:./storage/facilities}
    avatars: ${PRISM_AVATAR_STORAGE:./storage/avatars}

  avatars:
    max-bytes: ${PRISM_AVATAR_MAX_BYTES:5242880}

  facility-images:
    max-bytes: ${PRISM_FACILITY_IMAGE_MAX_BYTES:5242880}
    max-count: ${PRISM_FACILITY_IMAGE_MAX_COUNT:20}

  scheduler:
    reservation-lifecycle-ms: ${PRISM_RESERVATION_LIFECYCLE_MS:60000}
